name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # stdio process handling and paths differ on Windows/macOS: one run each.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: No invisible / bidi characters in tracked files (Trojan Source guard)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          git ls-files -z -- ':!*.png' | python -c "
          import sys, unicodedata
          bad = 0
          for f in sys.stdin.read().split(chr(0)):
              if not f: continue
              text = open(f, encoding='utf-8', errors='replace').read()
              for n, line in enumerate(text.splitlines(), 1):
                  for ch in line:
                      if unicodedata.category(ch) == 'Cf':
                          bad += 1
                          print(f'{f}:{n}: U+{ord(ch):04X} {unicodedata.name(ch, \"?\")}')
          sys.exit(1 if bad else 0)
          "

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install . pip-audit
      # Known-vulnerable versions of anything mcpsonar installs (PyPI advisory database).
      # A slow PyPI advisory API must not fail a build: longer socket timeout, and one retry
      # (a real finding fails both attempts, so it still blocks the build).
      - run: pip-audit --skip-editable --timeout 60 || (sleep 20 && pip-audit --skip-editable --timeout 60)

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build==1.6.1 twine==7.0.0 uv==0.13.4
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python scripts/check_package.py dist
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/mcpsonar --version
          /tmp/clean/bin/mcpsonar doctor --db /tmp/none.db --url http://127.0.0.1:1
          /tmp/clean/bin/mcpsonar tools --stdio "/tmp/clean/bin/python tests/fixtures/scripted_server.py pages"
      - name: uvx runs it straight from the wheel
        run: UV_PYTHON_DOWNLOADS=never uvx --python "$(which python)" --from dist/*.whl mcpsonar --version
      - name: Completion scripts parse in bash, zsh and fish
        run: |
          sudo apt-get install -y -qq zsh fish
          for sh in bash zsh; do /tmp/clean/bin/mcpsonar completion $sh > /tmp/c.$sh; $sh -n /tmp/c.$sh; done
          /tmp/clean/bin/mcpsonar completion fish > /tmp/c.fish
          fish --no-execute /tmp/c.fish

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t mcpsonar:ci .
      - name: Smoke test (non-root, healthy, setup token required)
        run: |
          docker run -d --name mcpsonar-ci -p 8675:8675 mcpsonar:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8675/api/auth/status && break; sleep 1; done
          test "$(docker exec mcpsonar-ci sh -c 'grep ^Uid /proc/1/status' | awk '{print $2}')" = "10001"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"a","password":"supersecret"}' http://127.0.0.1:8675/api/auth/setup)
          test "$code" = "403"
          docker logs mcpsonar-ci 2>&1 | grep -q "setup_token="
