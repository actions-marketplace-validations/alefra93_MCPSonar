name: Bug report
description: Something MCPSonar does wrong (not a security vulnerability — see SECURITY.md)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here: use *Security → Report a vulnerability*.
        **Remove credentials** (tokens, API keys, webhook URLs) from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Server config (redacted export is fine), commands, the server's transport.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MCPSonar version / commit
      placeholder: v0.6.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker / Compose, pip / from source, GitHub Action, other]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      render: text
