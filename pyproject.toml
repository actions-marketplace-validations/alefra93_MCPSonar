[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpsonar"
version = "0.2.0"
description = "Lightweight, protocol-aware health checks and observability for MCP servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Alessandro Fraleoni" }]
keywords = ["mcp", "model-context-protocol", "health-check", "monitoring", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
mcpsonar = "mcpsonar.cli:main"

[project.urls]
Homepage = "https://github.com/alessandro-fraleoni/mcpsonar"
Repository = "https://github.com/alessandro-fraleoni/mcpsonar"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpsonar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
